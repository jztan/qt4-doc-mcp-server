[project]
name = "qt-doc-mcp-server"
version = "0.5.0"
description = "Offline MCP Server for local Qt 4.8, Qt 5, and Qt 6 documentation"
requires-python = ">=3.11"
keywords = ["qt", "qt4", "qt5", "qt6", "mcp", "model-context-protocol", "documentation", "c++"]
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Kevin Tan", email = "jingzheng.tan@gmail.com"}
]
maintainers = [
    {name = "Kevin Tan", email = "jingzheng.tan@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Groupware",
]
dependencies = [
  "mcp[cli]>=1.28.1,<2",
  "uvicorn>=0.51.0",
  "python-dotenv>=1.2.2",
  "beautifulsoup4>=4.15.0",
  "markdownify>=1.2.3",
  "lxml>=6.1.1",
]

[project.urls]
Homepage = "https://github.com/jztan/qt4-doc-mcp-server"
Repository = "https://github.com/jztan/qt4-doc-mcp-server.git"
Issues = "https://github.com/jztan/qt4-doc-mcp-server/issues"
Changelog = "https://github.com/jztan/qt4-doc-mcp-server/blob/master/CHANGELOG.md"

[project.scripts]
qt-doc-mcp-server = "qt4_doc_mcp_server.main:run"
qt-doc-warm-md = "qt4_doc_mcp_server.cli:warm_md_main"
qt-doc-build-index = "qt4_doc_mcp_server.cli:build_index_main"

[tool.hatch.build.targets.wheel]
packages = ["src/qt4_doc_mcp_server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]
